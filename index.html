<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Track income and expenses, plan your month, and pay off debt.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tallybook">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#e7efeb">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e191c">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Tallybook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500&family=Zilla+Slab:wght@500;600;700&display=swap">
<style>
/* Layout concept: a check register. Security-paper ground, one pantograph panel for the number that matters, ruled rows for everything else. */
:root {
  --bg: #e7efeb; --surface: #f6faf7; --hero: #d6e6e2; --rosette: #7fa8a4;
  --ink: #14262b; --muted: #4f6668; --line: #c3d2cc; --line-strong: #8fa6a2;
  --accent: #0e5a6d; --accent-ink: #f4fbfa; --accent-soft: #d3e6e6;
  --good: #1a6e45; --good-soft: #d5ebdd; --warn: #8f5b00; --warn-soft: #f4e5c5;
  --bad: #ad2a22; --bad-soft: #f6dcd8;
  --series-a: #007f9f; --series-b: #c5752a; --track: #d9e4df;
  --display: "Zilla Slab", Rockwell, "Roboto Slab", Georgia, serif;
  --body: "Hanken Grotesk", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "Spline Sans Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e191c; --surface: #15242a; --hero: #173038; --rosette: #3f6a70;
  --ink: #e2ecE8; --muted: #9db2b0; --line: #2a3e44; --line-strong: #4b666b;
  --accent: #6cc6d8; --accent-ink: #082127; --accent-soft: #1b3f49;
  --good: #6ad19a; --good-soft: #17392a; --warn: #e6b65e; --warn-soft: #3a2d12;
  --bad: #f28b82; --bad-soft: #43201d;
  --series-a: #2f9bb4; --series-b: #c47f3e; --track: #24373d;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0e191c; --surface: #15242a; --hero: #173038; --rosette: #3f6a70;
  --ink: #e2ecE8; --muted: #9db2b0; --line: #2a3e44; --line-strong: #4b666b;
  --accent: #6cc6d8; --accent-ink: #082127; --accent-soft: #1b3f49;
  --good: #6ad19a; --good-soft: #17392a; --warn: #e6b65e; --warn-soft: #3a2d12;
  --bad: #f28b82; --bad-soft: #43201d;
  --series-a: #2f9bb4; --series-b: #c47f3e; --track: #24373d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 112px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.wrap { max-width: 1120px; margin-inline: auto; }
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  display: flex; align-items: center; gap: 24px; padding-block: 12px; border-bottom: 1px solid var(--line);
}
.brand { font: 700 22px/1 var(--display); letter-spacing: -.01em; margin-right: auto; }
.tabs { display: flex; gap: 4px; }
.tab {
  background: none; border: 0; padding: 8px 12px; border-radius: 6px; color: var(--muted); font-weight: 500; white-space: nowrap;
}
.tab:hover { color: var(--ink); background: var(--accent-soft); }
.tab[aria-current="page"] { color: var(--ink); font-weight: 700; box-shadow: inset 0 -2px 0 var(--accent); border-radius: 6px 6px 0 0; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 40px; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--line-strong);
  background: transparent; font-weight: 600; white-space: nowrap;
}
.btn:hover { background: var(--accent-soft); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.1); background: var(--accent); }
.btn.small { min-height: 34px; padding: 4px 10px; font-size: 13px; }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.danger:hover { background: var(--bad-soft); }
.linkish { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
.fab { display: none; }

.banner {
  margin-top: 16px; padding: 10px 14px; border: 1px dashed var(--line-strong); border-radius: 8px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; font-size: 14px;
}
.banner > span:first-child { flex: 1 1 260px; min-width: 0; }
.banner .acts { display: flex; gap: 8px; flex-wrap: wrap; }

main { display: flex; flex-direction: column; gap: 24px; padding-top: 20px; }
.vhead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.vhead h1 { font: 600 26px/1.15 var(--display); text-wrap: balance; margin-right: auto; }
.monthnav { display: inline-flex; align-items: center; gap: 2px; }
.monthnav button { width: 36px; height: 36px; border: 1px solid var(--line-strong); background: none; border-radius: 6px; font-size: 18px; line-height: 1; }
.monthnav button:hover:not(:disabled) { background: var(--accent-soft); }
.monthnav button:disabled { opacity: .35; cursor: default; }
.monthnav select { width: auto; min-height: 36px; padding: 4px 6px; border: 0; background: transparent; text-align: center; font: 600 17px/1.2 var(--display); cursor: pointer; }

.hero { position: relative; overflow: hidden; background: var(--hero); border-radius: 10px; padding: 24px; display: flex; flex-direction: column; gap: 6px; }
.hero > * { position: relative; }
.hero svg.rosette { position: absolute; right: -70px; top: -90px; width: 400px; height: 400px; pointer-events: none; opacity: .55; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.hero .eyebrow { color: var(--ink); }
.bignum { font: 700 clamp(44px, 9vw, 72px)/1.05 var(--display); letter-spacing: -.015em; font-variant-numeric: lining-nums tabular-nums; }
.bignum.over { color: var(--bad); }
.herosub { max-width: 60ch; font-size: 16px; }

.figs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-block: 1px solid var(--line-strong); }
.fig { padding: 12px 16px; border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.fig:first-child { border-left: 0; padding-left: 0; }
.fig b { font: 500 20px/1.25 var(--mono); font-variant-numeric: tabular-nums; }
.fig small { color: var(--muted); font-size: 13px; }

.cols { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 32px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 28px; min-width: 0; }
.sect { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.sect-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.sect-head h2 { font: 600 19px/1.2 var(--display); }
.sect-head small { color: var(--muted); font-size: 13px; }

.rows { display: flex; flex-direction: column; border-top: 1px solid var(--line-strong); }
.env {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 5px 12px; width: 100%; text-align: left;
  padding: 10px 2px; background: none; border: 0; border-bottom: 1px solid var(--line);
}
.env:hover { background: var(--accent-soft); }
.env .name { font-weight: 600; min-width: 0; }
.env .amt { font-family: var(--mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.env .amt b { color: var(--ink); font-weight: 500; }
.bar { grid-column: 1 / -1; position: relative; height: 8px; background: var(--track); border-radius: 4px; overflow: visible; }
.bar i { display: block; height: 100%; border-radius: 4px; background: var(--accent); max-width: 100%; }
.bar i.over { background: var(--bad); }
.bar i.near { background: var(--warn); }
.bar i.good { background: var(--good); }
.bar u { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); text-decoration: none; }
.env .note { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.info { background: var(--accent-soft); color: var(--ink); }

.due { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
.due .day { font: 500 13px/1.1 var(--mono); color: var(--muted); text-align: center; border-right: 1px solid var(--line); padding-right: 10px; }
.due .day b { display: block; font: 600 19px/1.1 var(--display); color: var(--ink); }
.due .what { min-width: 0; }
.due .what b { display: block; font-weight: 600; overflow-wrap: anywhere; }
.due .what small { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.due.done .what b, .due.done .day b { color: var(--muted); font-weight: 500; }

.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.chart { position: relative; width: 100%; min-width: 0; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { font: 400 11px var(--mono); fill: var(--muted); }
.chart text.lab { font: 600 12px var(--body); fill: var(--ink); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .base { stroke: var(--line-strong); stroke-width: 1; }
.chart .hit { fill: transparent; }
.chart .hit:hover, .chart .hit:focus { fill: var(--accent-soft); fill-opacity: .55; outline: none; }
.tip {
  position: absolute; z-index: 3; pointer-events: none; background: var(--surface); border: 1px solid var(--line-strong);
  border-radius: 6px; padding: 6px 10px; font-size: 13px; line-height: 1.4; white-space: nowrap; box-shadow: 0 4px 14px color-mix(in srgb, var(--ink) 18%, transparent);
}
.tip b { display: block; font-weight: 700; }
.tip span { font-family: var(--mono); font-variant-numeric: tabular-nums; display: block; }
details.data summary { cursor: pointer; font-size: 13px; color: var(--muted); }
details.data .tw { overflow-x: auto; margin-top: 6px; }

table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
table.t th { text-align: left; font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line-strong); }
table.t td { padding: 8px 8px 8px 0; border-bottom: 1px solid var(--line); }
table.t .r { text-align: right; padding-right: 0; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
table.t tr.sel td { background: var(--accent-soft); font-weight: 600; }
table.t tr.sel td:first-child { padding-left: 8px; }
table.t tr.sel td:last-child { padding-right: 8px; }

.reg { display: flex; flex-direction: column; border-top: 1px solid var(--line-strong); }
.reg-row {
  display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; text-align: left;
  background: none; border: 0; border-bottom: 1px solid var(--line); padding: 9px 2px;
}
.reg-row:hover { background: var(--accent-soft); }
.reg-row .d { font: 500 12px/1.15 var(--mono); color: var(--muted); text-align: center; border-right: 1px solid var(--line); padding-right: 10px; }
.reg-row .d b { display: block; font: 600 18px/1.1 var(--display); color: var(--ink); }
.reg-row .w { min-width: 0; }
.reg-row .w b { display: block; font-weight: 600; overflow-wrap: anywhere; }
.reg-row .w small { color: var(--muted); font-size: 13px; }
.reg-row .a { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.reg-row .a.in { color: var(--good); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pill { min-height: 34px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line-strong); background: none; font-size: 14px; font-weight: 500; }
.pill[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span { font-size: 13px; font-weight: 600; color: var(--muted); }
input[type=text], input[type=date], input[type=search], select {
  min-height: 40px; padding: 7px 10px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); width: 100%; min-width: 0; font-size: 16px;
}
input.money { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
.filters input, .filters select { width: auto; flex: 1 1 150px; }
.err { color: var(--bad); font-size: 13px; font-weight: 600; }
.hint { color: var(--muted); font-size: 13px; max-width: 68ch; }

.plan-row { display: grid; grid-template-columns: minmax(0, 1fr) auto 112px 36px; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.plan-row .avg { font: 400 12px var(--mono); color: var(--muted); white-space: nowrap; }
.plan-row .x { width: 36px; height: 36px; background: none; border: 0; color: var(--muted); font-size: 18px; border-radius: 6px; }
.plan-row .x:hover { background: var(--bad-soft); color: var(--bad); }
.sum { display: flex; flex-direction: column; font-family: var(--mono); font-size: 14px; font-variant-numeric: tabular-nums; }
.sum div { display: flex; justify-content: space-between; gap: 16px; padding: 5px 0; }
.sum span:first-child { font-family: var(--body); }
.sum .tot { border-top: 2px solid var(--ink); border-bottom: 3px double var(--ink); font-weight: 500; font-size: 17px; margin-top: 4px; padding-block: 8px; align-items: center; }

.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; }
.seg label { display: block; cursor: pointer; flex: 1 1 auto; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span { display: block; padding: 8px 12px; font-weight: 500; font-size: 14px; text-align: center; }
.seg input:checked + span { background: var(--ink); color: var(--bg); font-weight: 600; }
.seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: -3px; }
.controls { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px 32px; align-items: end; }
.sliderline { display: grid; grid-template-columns: minmax(0, 1fr) 104px; gap: 12px; align-items: center; }
input[type=range] { width: 100%; accent-color: var(--accent); height: 28px; }

.debt { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.debt h3 { font: 600 18px/1.2 var(--display); overflow-wrap: anywhere; }
.debt .terms { color: var(--muted); font-size: 13px; }
.debt .bal { font: 500 18px/1.2 var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
.debt .bar { grid-column: 1 / -1; }
.debt .meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 13px; color: var(--muted); }
.debt .acts { grid-column: 1 / -1; display: flex; gap: 8px; }
.stamp {
  display: inline-block; font: 700 19px/1 var(--display); letter-spacing: .12em; color: var(--good);
  border: 3px double var(--good); border-radius: 5px; padding: 5px 9px 4px; transform: rotate(-7deg);
}
.setup { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
.setup li { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.setup .n { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line-strong); display: grid; place-items: center; font: 500 13px var(--mono); }
.setup .ok .n, .setup li.ok .n { background: var(--good-soft); color: var(--good); border-color: var(--good); }
.empty { padding: 16px 0; color: var(--muted); border-top: 1px solid var(--line-strong); }
.empty b { color: var(--ink); display: block; font: 600 17px/1.3 var(--display); }

dialog#sheet {
  border: 0; padding: 0; background: var(--surface); color: var(--ink); border-radius: 12px; width: min(480px, calc(100vw - 32px)); max-height: 90dvh; overflow: auto;
  box-shadow: 0 18px 50px color-mix(in srgb, var(--ink) 30%, transparent);
}
dialog#sheet::backdrop { background: rgba(8, 20, 24, .5); }
.sheetform { display: flex; flex-direction: column; gap: 14px; padding: 20px; padding-bottom: max(20px, env(safe-area-inset-bottom, 0px)); }
.sheetform h2 { font: 600 21px/1.2 var(--display); }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.sheetacts { display: flex; gap: 8px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
.sheetacts .del { margin-right: auto; }
.bigmoney { font: 500 26px/1.2 var(--mono) !important; min-height: 52px !important; }
.seg.full { display: flex; }

#toast { position: fixed; z-index: 20; left: 50%; transform: translateX(-50%); bottom: calc(88px + env(safe-area-inset-bottom, 0px)); width: max-content; max-width: calc(100vw - 32px); }
#toast div { display: flex; gap: 14px; align-items: center; background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 8px; font-size: 14px; }
#toast button { background: none; border: 0; color: inherit; font-weight: 700; text-decoration: underline; padding: 0; }

.bottomnav { display: none; }
@media (max-width: 760px) {
  .top .tabs, .top .btn.addtop { display: none; }
  .bottomnav {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
    background: var(--surface); border-top: 1px solid var(--line-strong);
    padding: 4px max(8px, env(safe-area-inset-right, 0px)) calc(4px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
  }
  .bottomnav .tab { padding: 12px 2px; font-size: 14px; text-align: center; }
  .fab {
    display: inline-flex; position: fixed; z-index: 6; min-height: 48px; padding: 10px 18px; border-radius: 24px;
    right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(64px + env(safe-area-inset-bottom, 0px));
    box-shadow: 0 6px 16px color-mix(in srgb, var(--ink) 28%, transparent);
  }
  .cols, .controls { grid-template-columns: minmax(0, 1fr); gap: 24px; }
  .figs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .fig:nth-child(odd) { border-left: 0; padding-left: 0; }
  .fig:nth-child(n+3) { border-top: 1px solid var(--line); }
  .hero { padding: 20px 16px; }
  .hero svg.rosette { right: -130px; top: -110px; }
  .plan-row { grid-template-columns: minmax(0, 1fr) 104px 36px; }
  .plan-row .avg { grid-column: 1; grid-row: 2; }
  dialog#sheet { width: 100vw; max-width: 100vw; margin: auto 0 0; border-radius: 14px 14px 0 0; }
}
@media (prefers-reduced-motion: no-preference) {
  .bar i { transition: width .25s ease-out; }
  .stamp { animation: stamp .28s ease-out both; }
  @keyframes stamp { from { transform: rotate(-7deg) scale(1.5); } to { transform: rotate(-7deg) scale(1); } }
}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">Tallybook</div>
    <nav class="tabs" aria-label="Sections" id="tabs"></nav>
    <button class="btn primary addtop" data-act="add" type="button">+ Add entry</button>
  </header>
  <div id="banner"></div>
  <main id="main"></main>
</div>
<button class="btn primary fab" data-act="add" type="button">+ Add</button>
<nav class="bottomnav" aria-label="Sections" id="bottomnav"></nav>
<dialog id="sheet"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/*SIM-START*/
// Debt payoff simulator. All money is in cents. A month: interest accrues, every debt gets its minimum,
// then whatever is left of the monthly total goes to the target debts in order.
function orderDebts(debts, strategy) {
  const list = debts.slice();
  if (strategy === 'snowball') list.sort((a, b) => a.balance - b.balance || b.apr - a.apr);
  else list.sort((a, b) => b.apr - a.apr || a.balance - b.balance);
  return list;
}
function simulate(debts, opts) {
  const { extra = 0, strategy = 'avalanche', rollover = true, cap = 600 } = opts || {};
  const live = orderDebts(debts.filter(d => d.balance > 0), strategy).map(d => ({ id: d.id, bal: d.balance, apr: d.apr, min: d.min }));
  const series = [live.reduce((s, d) => s + d.bal, 0)];
  const paidAt = {};
  const monthly = live.reduce((s, d) => s + d.min, 0) + extra;
  let interest = 0, months = 0, paid = 0;
  while (live.some(d => d.bal > 0.5) && months < cap) {
    months++;
    let pot = rollover ? monthly : Infinity;
    for (const d of live) if (d.bal > 0) {
      const i = Math.round(d.bal * d.apr / 100 / 12);
      d.bal += i; interest += i;
    }
    for (const d of live) if (d.bal > 0) {
      const p = Math.min(d.min, d.bal, pot);
      d.bal -= p; pot -= p; paid += p;
    }
    if (rollover) for (const d of live) if (d.bal > 0 && pot > 0) {
      const p = Math.min(pot, d.bal);
      d.bal -= p; pot -= p; paid += p;
    }
    for (const d of live) if (d.bal <= 0.5 && !(d.id in paidAt)) { d.bal = 0; paidAt[d.id] = months; }
    series.push(live.reduce((s, d) => s + d.bal, 0));
  }
  return { months, interest, paid, paidAt, series, monthly, stuck: live.some(d => d.bal > 0.5) };
}
/*SIM-END*/

function localBackend() {
  const KEY = 'tallybook-v1';
  let mem = null;
  try { mem = JSON.parse(localStorage.getItem(KEY)); } catch (e) { mem = null; }
  mem = mem || { tx: {}, debts: {}, bills: {}, plan: {} };
  const subs = {};
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) { toast('This phone could not save that. Free up some storage, then save a backup from the Plan tab.'); } };
  const emit = c => subs[c] && subs[c](Object.entries(mem[c]).map(([id, v]) => ({ id, ...v })));
  return {
    mode: 'local',
    listen(c, cb) { subs[c] = cb; emit(c); },
    async set(c, id, data) { mem[c][id] = data; persist(); emit(c); },
    async del(c, id) { delete mem[c][id]; persist(); emit(c); },
    async replaceAll(next) { mem = next; persist(); Object.keys(mem).forEach(emit); },
  };
}
let chain = Promise.resolve();
function write(fn) {
  chain = chain.then(async () => {
    try { await fn(); }
    catch (e) {
      if (e && e.code === 'unavailable') {
        await new Promise(r => setTimeout(r, 600 + Math.random() * 600));
        try { await fn(); return; } catch (e2) { e = e2; }
      }
      toast(e && e.code === 'quota_exceeded'
        ? 'Storage is full. Delete old entries to make room.'
        : 'That change did not save. Check your connection and try again.');
    }
  });
  return chain;
}
const strip = ({ id, ...rest }) => rest;

const allCats = () => S.plan.cats || [];

const activeDebts = () => S.debts.filter(d => d.balance > 0);
const minsTotal = () => sum(activeDebts(), d => Math.min(d.min, d.balance));
const signed = t => (t.refund ? -t.amount : t.amount);
const inMonth = m => S.tx.filter(t => t.date && t.date.startsWith(m));
const describe = t => t.note || (t.kind === 'income' ? 'Income' : t.kind === 'debt' ? ((debtById(t.debtId) || {}).name || 'Debt payment') : t.kind === 'transfer' ? 'Transfer' : catName(t.cat));

function dueItems(m) {
  const txs = inMonth(m), out = [];
  for (const b of S.bills) {
    out.push({ type: 'bill', id: b.id, name: b.name, kind: b.kind, cat: b.cat, amount: b.amount, date: dayIn(m, b.day), done: txs.some(t => t.billId === b.id) });
  }
  for (const d of S.debts) {
    const paid = sum(txs.filter(t => t.kind === 'debt' && t.debtId === d.id), t => t.amount);
    if (d.balance <= 0 && !paid) continue;
    out.push({ type: 'debt', id: d.id, name: d.name, kind: 'debt', amount: Math.min(d.min, d.balance || d.min), date: dayIn(m, d.day), done: d.balance <= 0 || paid >= d.min });
  }
  return out.sort((a, b) => a.date.localeCompare(b.date) || a.name.localeCompare(b.name));
}
function monthStats(m) {
  const txs = inMonth(m), saveIds = new Set(allCats().filter(c => c.save).map(c => c.id));
  const byCat = {};
  let income = 0, spent = 0, saved = 0, debt = 0;

}

/* ---------- transaction logic ---------- */
function saveTx(next, prev) {
  const id = prev ? prev.id : uid('t');
  const changes = {};
  const bal = did => did in changes ? changes[did] : (debtById(did) || {}).balance || 0;
  if (prev && prev.kind === 'debt' && debtById(prev.debtId)) changes[prev.debtId] = bal(prev.debtId) + (prev.applied ?? prev.amount);
  const doc = { ...next };
  if (prev && prev.example) doc.example = true;
  if (next.kind === 'debt' && debtById(next.debtId)) {
    doc.applied = Math.min(next.amount, bal(next.debtId));
    changes[next.debtId] = bal(next.debtId) - doc.applied;
  }
  write(() => backend.set('tx', id, doc));
  for (const did of Object.keys(changes)) { const d = debtById(did); putDoc('debts', { ...d, balance: changes[did] }); }
  return { id, ...doc };
}
function removeTx(t) {
  const d = t.kind === 'debt' ? debtById(t.debtId) : null;
  delDoc('tx', t.id);
  if (d) putDoc('debts', { ...d, balance: d.balance + (t.applied ?? t.amount) });
}
function undoLog(t) { toastUndo(`Logged ${money(t.amount)}`, () => removeTx(t)); }
function logDue(type, id, m) {
  if (type === 'debt') {
    const d = debtById(id);
    undoLog(saveTx({ kind: 'debt', debtId: id, amount: Math.min(d.min, d.balance), date: m === curMonth() ? today() : dayIn(m, d.day), note: d.name }));
  } else {
    const b = S.bills.find(x => x.id === id);
    const doc = { kind: b.kind === 'income' ? 'income' : 'expense', amount: b.amount, date: m === curMonth() ? today() : dayIn(m, b.day), note: b.name, billId: id };
    if (b.kind !== 'income') doc.cat = b.cat || 'other';
    undoLog(saveTx(doc));
  }
}

/* ---------- pantograph rosette, the check-paper flourish ---------- */
function rosette() {
  let d = '';
  for (let k = 0; k < 7; k++) {
    const R = 176, r = 44 + k * 1.5, h = 62 + k * 7, rot = k * Math.PI / 21;
    let p = '';
    for (let i = 0; i <= 900; i++) {
      const t = i / 900 * Math.PI * 2 * 4;
      const x = (R - r) * Math.cos(t) + h * Math.cos((R - r) / r * t);
      const y = (R - r) * Math.sin(t) - h * Math.sin((R - r) / r * t);
      const sx = (x * Math.cos(rot) - y * Math.sin(rot)) * .86, sy = (x * Math.sin(rot) + y * Math.cos(rot)) * .86;
      p += (i ? 'L' : 'M') + sx.toFixed(1) + ' ' + sy.toFixed(1);
    }
    d += p;
  }
  return `<svg class="rosette" viewBox="-200 -200 400 400" aria-hidden="true"><path d="${d}" fill="none" stroke="var(--rosette)" stroke-width=".5"/></svg>`;
}

          <details class="data"><summary>Show as a table</summary><div class="tw"><table class="t"><thead><tr><th>Month</th><th class="r">In</th><th class="r">Out</th><th class="r">Net</th></tr></thead>
          <tbody>${flow.map(r => `<tr><td>${esc(monthName(r.m, { month: 'short', year: 'numeric' }))}</td><td class="r">${money(r.inn)}</td><td class="r">${money(r.out)}</td><td class="r">${money(r.inn - r.out)}</td></tr>`).join('')}</tbody></table></div></details>
        </section>

}

function activityView() {
  const m = UI.month;
  let list = inMonth(m).slice().sort((a, b) => b.date.localeCompare(a.date));
  const totals = { inn: sum(list.filter(t => t.kind === 'income'), t => t.amount), out: sum(list.filter(t => t.kind === 'expense' || t.kind === 'debt'), signed) };

  return `<div class="vhead"><h1>Entries</h1>${monthNav()}</div>
    <div class="sect-head"><small class="num">${money(totals.inn)} in &middot; ${money(totals.out)} out</small>

    <div class="filters">

      <select id="f-cat" aria-label="Filter by category"><option value="">All categories</option>${allCats().map(c => `<option value="${esc(c.id)}" ${UI.cat === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select>

      const d = parseD(t.date), sub = t.kind === 'income' ? 'Money in' : t.kind === 'transfer' ? 'Transfer, not counted as spending' : t.kind === 'debt' ? `Debt payment${debtById(t.debtId) ? ' &middot; ' + esc(debtById(t.debtId).name) : ''}` : (t.refund ? 'Refund &middot; ' : '') + esc(catName(t.cat));

}

            <span class="a ${b.kind === 'income' ? 'in' : ''}">${money(b.amount)}</span></button>`).join('')}</div>`

function debtResults() {
  const extra = S.plan.extra || 0, strat = S.plan.strategy || 'avalanche', debts = activeDebts();
  const chosen = simulate(debts, { extra, strategy: strat });
  const base = simulate(debts, { extra: 0, rollover: false });
  const other = simulate(debts, { extra, strategy: strat === 'avalanche' ? 'snowball' : 'avalanche' });
  const total = sum(debts, d => d.balance);
  const saved = base.interest - chosen.interest, sooner = base.months - chosen.months;
  const heroTxt = chosen.stuck
    ? 'At these payments the balance never reaches zero, because interest is growing faster than you pay it down. Raise a minimum or add extra.'
    : `${money(total)} owed today. Paying ${money(chosen.monthly)} a month${saved > 0 && !base.stuck ? ` saves ${money0(saved)} in interest and finishes ${spanLabel(sooner)} sooner than paying only minimums` : ''}.`;
  const row = (label, s, sel) => `<tr class="${sel ? 'sel' : ''}"><td>${label}</td><td class="r">${s.stuck ? 'Never' : futureLabel(s.months)}</td><td class="r">${s.stuck ? '&mdash;' : money0(s.interest)}</td></tr>`;
  const planName = k => k === 'avalanche' ? 'Highest rate first' : 'Smallest balance first';
  const order = orderDebts(debts, strat).slice().sort((a, b) => (chosen.paidAt[a.id] ?? 1e9) - (chosen.paidAt[b.id] ?? 1e9));
  const target = orderDebts(debts, strat)[0];
  const cmp = other.interest - chosen.interest;
  const debtCard = d => {
    const pct = d.start > 0 ? (1 - d.balance / d.start) * 100 : 0, mi = Math.round(d.balance * d.apr / 100 / 12), when = chosen.paidAt[d.id];
    return `<div class="debt"><div><h3>${esc(d.name)}</h3><div class="terms">${(+d.apr).toFixed(2)}% APR &middot; ${money(d.min)} minimum &middot; due the ${ordinal(d.day)}</div></div>
      <div class="bal">${money(d.balance)}</div>
      <div class="bar" role="img" aria-label="${Math.round(pct)} percent paid off"><i class="good" style="width:${Math.max(0, pct).toFixed(1)}%"></i></div>
      <div class="meta">${target && target.id === d.id && (extra > 0 || chosen.monthly > sum(debts, x => x.min)) ? '<span class="chip info">Extra goes here first</span>' : ''}
        ${d.min <= mi ? `<span class="chip bad">&#9650; Minimum doesn&rsquo;t cover ${money(mi)} monthly interest</span>` : ''}
        <span>${Math.round(pct)}% paid off</span><span>${when ? `Paid off by ${futureLabel(when)}` : 'Not paid off at this rate'}</span></div>
      <div class="acts"><button type="button" class="btn small" data-act="pay-debt" data-id="${esc(d.id)}">Log payment</button><button type="button" class="btn small" data-act="edit-debt" data-id="${esc(d.id)}">Edit</button></div></div>`;
  };
  const done = S.debts.filter(d => d.balance <= 0);
  return `<section class="hero">${ROSETTE}<p class="eyebrow">Debt-free date</p><p class="bignum ${chosen.stuck ? 'over' : ''}">${chosen.stuck ? 'Not reachable' : futureLabel(chosen.months)}</p><p class="herosub">${esc(heroTxt)}</p></section>
    <div class="cols">
      <div class="stack">
        <section class="sect"><div class="sect-head"><h2>Pay-off order</h2><button type="button" class="btn small" data-act="add-debt">+ Add debt</button></div>
          <div class="rows">${order.map(debtCard).join('')}
          ${done.map(d => `<div class="debt"><div><h3>${esc(d.name)}</h3><div class="terms">${money(d.start)} cleared</div></div><div class="bal"><span class="stamp">PAID</span></div><div class="acts"><button type="button" class="btn small" data-act="edit-debt" data-id="${esc(d.id)}">Edit</button></div></div>`).join('')}</div>
        </section>
      </div>
      <div class="stack">
        <section class="sect"><div class="sect-head"><h2>Compare plans</h2></div>
          <table class="t"><thead><tr><th>Plan</th><th class="r">Debt-free</th><th class="r">Interest</th></tr></thead><tbody>
            ${row('Highest rate first', strat === 'avalanche' ? chosen : other, strat === 'avalanche')}
            ${row('Smallest balance first', strat === 'snowball' ? chosen : other, strat === 'snowball')}
            ${row('Minimums only', base, false)}
          </tbody></table>
          <p class="hint">${cmp > 0 ? `${planName(strat)} costs ${money0(cmp)} less in interest than the other order.`
            : cmp < 0 ? `${planName(strat)} costs ${money0(-cmp)} more in interest, but clears your first debt sooner, which many people find easier to stick with.`
            : 'Both orders cost the same with your current debts.'}</p>
        </section>
        <section class="sect"><div class="sect-head"><h2>Total balance over time</h2></div>
          <div class="legend"><span><i style="background:var(--series-a)"></i>Your plan</span><span><i style="background:var(--series-b)"></i>Minimums only</span></div>
          <div class="chart" data-chart="payoff"></div></section>
        <p class="hint">These are estimates. They assume today&rsquo;s rates and minimums hold and no new charges. Logged payments reduce a balance by the full amount, so update each balance from your statement now and then to pick up interest.</p>
      </div>
    </div>`;
}

function debtsView() {
  const p = S.plan, extra = p.extra || 0, strat = p.strategy || 'avalanche';

    return `<div class="vhead"><h1>Debt payoff</h1></div>

      <div class="rows">${S.debts.map(d => `<div class="debt"><div><h3>${esc(d.name)}</h3><div class="terms">${money(d.start)} cleared</div></div><div class="bal"><span class="stamp">PAID</span></div><div class="acts"><button type="button" class="btn small" data-act="edit-debt" data-id="${esc(d.id)}">Edit</button></div></div>`).join('')}</div>

        <input id="extra-num" class="money" type="text" inputmode="decimal" value="${plain(extra) || '0.00'}" aria-label="Extra per month in dollars"></div></div>
      <div class="field"><span>Which debt gets the extra first</span>

          <label><input type="radio" name="strategy" id="st-av" value="avalanche" ${strat === 'avalanche' ? 'checked' : ''}><span>Highest rate (avalanche)</span></label>
          <label><input type="radio" name="strategy" id="st-sn" value="snowball" ${strat === 'snowball' ? 'checked' : ''}><span>Smallest balance (snowball)</span></label>
        </div></div>
    </section>
    <div id="debt-results" style="display:flex;flex-direction:column;gap:24px">${debtResults()}</div>`;

/* ---------- charts ---------- */
function niceMax(v) {
  if (v <= 0) return 100000;
  const p = Math.pow(10, Math.floor(Math.log10(v))), n = v / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 4 ? 4 : n <= 6 ? 6 : n <= 8 ? 8 : 10) * p;
}
const axisMoney = c => { const d = c / 100; return d >= 1000 ? '$' + (d / 1000).toFixed(d % 1000 ? 1 : 0).replace(/\.0$/, '') + 'k' : '$' + d; };
function showTip(el, html, x, y) {
  let tip = $('.tip', el);
  if (!tip) { tip = document.createElement('div'); tip.className = 'tip'; el.appendChild(tip); }
  tip.innerHTML = html; tip.hidden = false;
  const w = tip.offsetWidth, ew = el.clientWidth;
  tip.style.left = Math.max(0, Math.min(ew - w, x - w / 2)) + 'px';
  tip.style.top = Math.max(-8, y - tip.offsetHeight - 10) + 'px';
}
const hideTip = el => { const t = $('.tip', el); if (t) t.hidden = true; };

function drawFlow(el) {
  const rows = flowData(UI.month), w = Math.max(280, el.clientWidth), h = 210, m = { t: 12, r: 4, b: 24, l: 40 };
  const max = niceMax(Math.max(1, ...rows.flatMap(r => [r.inn, r.out])));
  const y = v => m.t + (h - m.t - m.b) * (1 - v / max), gw = (w - m.l - m.r) / rows.length, bw = Math.min(20, (gw - 14) / 2);
  const bar = (x, v, c) => {
    if (v <= 0) return '';
    const top = y(v), r = Math.min(4, bw / 2, y(0) - top);
    return `<path fill="${c}" d="M${x} ${y(0)}V${top + r}Q${x} ${top} ${x + r} ${top}H${x + bw - r}Q${x + bw} ${top} ${x + bw} ${top + r}V${y(0)}Z"/>`;
  };
  let s = '';
  for (let i = 0; i <= 4; i++) { const v = max * i / 4; s += `<line class="${i ? 'grid' : 'base'}" x1="${m.l}" x2="${w - m.r}" y1="${y(v)}" y2="${y(v)}"/><text x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end">${axisMoney(v)}</text>`; }
  rows.forEach((r, i) => {
    const gx = m.l + gw * i, cx = gx + gw / 2;
    s += `<rect class="hit" x="${gx}" y="${m.t}" width="${gw}" height="${h - m.t - m.b}" data-i="${i}" tabindex="0" aria-label="${esc(monthName(r.m))}: ${money(r.inn)} in, ${money(r.out)} out"/>`;
    s += bar(cx - bw - 1, r.inn, 'var(--series-a)') + bar(cx + 1, r.out, 'var(--series-b)');
    s += `<text x="${cx}" y="${h - 7}" text-anchor="middle">${esc(monthName(r.m, { month: 'short' }))}</text>`;
  });
  el.innerHTML = `<svg viewBox="0 0 ${w} ${h}" height="${h}" role="group" aria-label="Money in and out by month">${s}</svg>`;
  el.querySelectorAll('.hit').forEach(n => {
    const i = +n.dataset.i, r = rows[i], show = () => showTip(el, `<b>${esc(monthName(r.m))}</b><span>In  ${money(r.inn)}</span><span>Out ${money(r.out)}</span><span>Net ${money(r.inn - r.out)}</span>`, m.l + gw * i + gw / 2, y(Math.max(r.inn, r.out)));
    n.addEventListener('pointerenter', show); n.addEventListener('focus', show);
    n.addEventListener('pointerleave', () => hideTip(el)); n.addEventListener('blur', () => hideTip(el));
  });
}

function drawPayoff(el) {
  const debts = activeDebts(), a = simulate(debts, { extra: S.plan.extra || 0, strategy: S.plan.strategy }), b = simulate(debts, { extra: 0, rollover: false });
  const A = a.series, B = b.series;
  const n = Math.max(1, Math.min(360, Math.max(a.stuck ? 60 : a.months, b.stuck ? Math.max(a.months * 1.5, 60) : b.months)));
  const w = Math.max(280, el.clientWidth), h = 230, m = { t: 22, r: 8, b: 24, l: 44 };
  const max = niceMax(Math.max(...A.slice(0, n + 1), ...B.slice(0, n + 1)));
  const x = i => m.l + (w - m.l - m.r) * i / n, y = v => m.t + (h - m.t - m.b) * (1 - v / max);
  const line = S0 => S0.slice(0, n + 1).map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join('');
  let s = '';
  for (let i = 0; i <= 4; i++) { const v = max * i / 4; s += `<line class="${i ? 'grid' : 'base'}" x1="${m.l}" x2="${w - m.r}" y1="${y(v)}" y2="${y(v)}"/><text x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end">${axisMoney(v)}</text>`; }
  const stepYears = n > 180 ? 5 : n > 96 ? 2 : 1, yr = now().getFullYear(), offset = 12 - now().getMonth();
  for (let k = 0; ; k++) {
    const i = offset + k * 12 * stepYears;
    if (i > n) break;
    s += `<text x="${x(i)}" y="${h - 7}" text-anchor="middle">${yr + 1 + k * stepYears}</text>`;
  }
  const aEnd = Math.min(n, A.length - 1);
  s += `<path d="${line(A)}L${x(aEnd)} ${y(0)}L${x(0)} ${y(0)}Z" fill="var(--series-a)" fill-opacity=".14"/>`;
  s += `<path d="${line(B)}" fill="none" stroke="var(--series-b)" stroke-width="2" stroke-linejoin="round"/>`;
  s += `<path d="${line(A)}" fill="none" stroke="var(--series-a)" stroke-width="2" stroke-linejoin="round"/>`;
  if (!a.stuck) {
    const ex = x(a.months), right = ex > w - 90;
    s += `<circle cx="${ex}" cy="${y(0)}" r="5" fill="var(--series-a)" stroke="var(--surface)" stroke-width="2"/>`;
    s += `<text class="lab" x="${ex + (right ? -8 : 9)}" y="${y(0) - (right ? 22 : 9)}" text-anchor="${right ? 'end' : 'start'}">${esc(futureLabel(a.months))}</text>`;
  }
  s += `<line class="cross" x1="0" x2="0" y1="${m.t}" y2="${y(0)}" stroke="var(--line-strong)" stroke-width="1" visibility="hidden"/>`;
  s += `<rect class="hit-all" x="${m.l}" y="${m.t}" width="${w - m.l - m.r}" height="${h - m.t - m.b}" fill="transparent"/>`;
  el.innerHTML = `<svg viewBox="0 0 ${w} ${h}" height="${h}" role="img" aria-label="Total debt falling to zero by ${esc(futureLabel(a.months))} on your plan, and ${esc(b.stuck ? 'never' : futureLabel(b.months))} on minimums only">${s}</svg>`;
  const hit = $('.hit-all', el), cross = $('.cross', el);
  const move = e => {
    const svg = hit.ownerSVGElement.getBoundingClientRect(), px = e.clientX - svg.left, i = Math.max(0, Math.min(n, Math.round((px - m.l) / (w - m.l - m.r) * n)));
    cross.setAttribute('x1', x(i)); cross.setAttribute('x2', x(i)); cross.setAttribute('visibility', 'visible');
    showTip(el, `<b>${esc(futureLabel(i))}</b><span>Plan ${money0(A[i] ?? 0)}</span><span>Min. ${money0(B[i] ?? 0)}</span>`, x(i), m.t + 34);
  };
  hit.addEventListener('pointermove', move); hit.addEventListener('pointerdown', move);
  hit.addEventListener('pointerleave', () => { cross.setAttribute('visibility', 'hidden'); hideTip(el); });
}
function drawCharts() {
  document.querySelectorAll('[data-chart]').forEach(el => { (el.dataset.chart === 'flow' ? drawFlow : drawPayoff)(el); });
}

/* ---------- render ---------- */
const VIEWS = [['month', 'Month', monthView], ['activity', 'Entries', activityView], ['plan', 'Plan', planView], ['debts', 'Debts', debtsView]];
function renderNav() {
  const html = VIEWS.map(([k, l]) => `<button type="button" class="tab" data-act="go" data-v="${k}" ${UI.view === k ? 'aria-current="page"' : ''}>${l}</button>`).join('');

function renderBanner() {

      : `This backup holds ${r.tx.length.toLocaleString()} entries, ${r.debts.length} debts and ${r.bills.length} repeating items. Adding keeps what is on this phone. Replacing erases it first.`;
    parts.push(`<div class="banner"><span><b>${r.isImport ? 'Add these entries?' : 'Add this backup?'}</b> ${what}</span><span class="acts"><button type="button" class="btn small primary" data-act="merge-yes">Add entries</button>${r.isImport ? '' : '<button type="button" class="btn small danger" data-act="restore-yes">Replace everything</button>'}<button type="button" class="btn small" data-act="restore-no">Cancel</button></span></div>`);
  }

    const how = installPrompt ? 'Add it to your home screen so it opens like any other app.'
      : IS_IOS ? 'In Safari, tap Share, then Add to Home Screen.' : 'Open your browser menu, then tap Add to Home screen.';
    parts.push(`<div class="banner"><span><b>Install Tallybook.</b> ${how}</span><span class="acts">${installPrompt ? '<button type="button" class="btn small primary" data-act="install">Install</button>' : ''}<button type="button" class="btn small" data-act="hide-install">Not now</button></span></div>`);

/* ---------- export ---------- */
async function exportCsv() {
  const cell = s => {
    let v = String(s ?? '');
    if (/^[=+\-@]/.test(v)) v = "'" + v;
    return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  };
  const rows = [['Date', 'Type', 'Category or debt', 'Note', 'Amount']];
  S.tx.slice().sort((a, b) => a.date.localeCompare(b.date)).forEach(t => {
    rows.push([t.date, t.kind === 'income' ? 'Money in' : t.kind === 'debt' ? 'Debt payment' : t.kind === 'transfer' ? (t.dir === 'in' ? 'Transfer in' : 'Transfer out') : t.refund ? 'Refund' : 'Expense',
      t.kind === 'debt' ? (debtById(t.debtId) || {}).name : t.kind === 'expense' ? catName(t.cat) : '', t.note, (t.amount / 100).toFixed(2)]);
  });
  try {
    await downloads.save({ filename: `tallybook-${today()}.csv`, data: rows.map(r => r.map(cell).join(',')).join('\n') });
    toast('CSV saved');
  } catch (e) {
    if (e && e.code !== 'declined') toast('The CSV could not be saved here. Try again in a moment.');
  }
}

/* ---------- boot ---------- */
function deliver(coll, docs) {
  if (coll === 'plan') {
    const d = docs.find(x => x.id === 'main');
    const plan = d ? strip(d) : defaultPlan();
    S.plan = { ...defaultPlan(), ...plan, cats: (plan.cats && plan.cats.length ? plan.cats : defaultPlan().cats).map(c => ({ ...c })) };
  } else {
    S[coll] = docs.filter(x => coll !== 'tx' || x.date);
  }
  S.got[coll] = true;
  if (['tx', 'debts', 'bills', 'plan'].every(c => S.got[c])) S.ready = true;
  if (S.ready) render();
}
function connect() {
  const slow = setTimeout(() => { if (!S.ready) { S.slow = true; render(); } }, 10000);
  for (const c of ['tx', 'debts', 'bills', 'plan']) {
    backend.listen(c, docs => { deliver(c, docs); if (S.ready) clearTimeout(slow); }, () => { S.failed = true; clearTimeout(slow); S.got[c] = true; if (['tx', 'debts', 'bills', 'plan'].every(k => S.got[k])) S.ready = true; render(); });
  }
}
const IS_IOS = /iPhone|iPad|iPod/i.test(navigator.userAgent), IS_ANDROID = /Android/i.test(navigator.userAgent);

async function saveBackup() {
  const payload = { app: 'tallybook', version: 1, savedAt: new Date().toISOString(), tx: S.tx, debts: S.debts, bills: S.bills, plan: S.plan };
  try {
    await downloads.save({ filename: `tallybook-backup-${today()}.json`, data: JSON.stringify(payload) });
    pref.set(KEY_BACKUP, today()); toast('Backup saved. Keep it somewhere other than this phone, like your email or cloud storage.'); render();
  } catch (e) { if (!e || e.code !== 'declined') toast('The backup could not be saved. Try again.'); }
}
const cents = v => { const n = Math.round(Number(v)); return isFinite(n) && n >= 0 ? n : 0; };
const dayNum = v => Math.min(31, Math.max(1, Math.round(Number(v)) || 1));
const hasId = x => x && typeof x === 'object' && typeof x.id === 'string' && x.id;
const text = v => (v == null ? undefined : String(v));
function parseBackup(raw) {

  const isImport = b.kind === 'import';
  if (!isImport && (!Array.isArray(b.debts) || !Array.isArray(b.bills))) throw new Error('format');
  const clean = o => JSON.parse(JSON.stringify(o));
  return {
    tx: b.tx.filter(t => hasId(t) && /^\d{4}-\d{2}-\d{2}$/.test(t.date) && ['income', 'expense', 'debt', 'transfer'].includes(t.kind)).map(t => clean({ ...t, amount: cents(t.amount), applied: t.applied == null ? undefined : cents(t.applied), note: text(t.note), cat: text(t.cat), debtId: text(t.debtId), billId: text(t.billId), dir: t.kind === 'transfer' ? (t.dir === 'in' ? 'in' : 'out') : undefined, refund: t.refund ? true : undefined })),
    isImport,
    cats: (Array.isArray(b.cats) ? b.cats : []).filter(hasId).map(c => ({ id: c.id, name: String(c.name || 'Category'), budget: 0 })),
    debts: (b.debts || []).filter(hasId).map(d => clean({ ...d, name: String(d.name || 'Debt'), balance: cents(d.balance), start: cents(d.start), min: cents(d.min), apr: Math.max(0, Number(d.apr) || 0), day: dayNum(d.day) })),
    bills: (b.bills || []).filter(hasId).map(x => clean({ ...x, name: String(x.name || 'Bill'), amount: cents(x.amount), day: dayNum(x.day), kind: x.kind === 'income' ? 'income' : 'bill', cat: text(x.cat) })),
    plan: b.plan && Array.isArray(b.plan.cats) ? clean({ ...b.plan, income: cents(b.plan.income), extra: cents(b.plan.extra), strategy: b.plan.strategy === 'snowball' ? 'snowball' : 'avalanche', cats: b.plan.cats.filter(hasId).map(c => ({ ...c, name: String(c.name || 'Category'), budget: cents(c.budget) })) }) : defaultPlan(),
  };
}
async function applyRestore(r) {
  const byId = a => Object.fromEntries(a.map(({ id, ...rest }) => [id, rest]));
  await backend.replaceAll({ tx: byId(r.tx), debts: byId(r.debts), bills: byId(r.bills), plan: { main: r.plan } });
  UI.restore = null; UI.month = curMonth(); toast('Backup restored.'); go('month');
}
async function applyMerge(r) {
  const byId = a => Object.fromEntries(a.map(({ id, ...rest }) => [id, rest]));
  const have = new Set(S.tx.map(t => t.id));
  // Entries typed by hand have no statement id, so match those on date, type and amount, one for one.
  const typed = {};
  const sig = t => [t.date, t.kind, t.amount].join('|');
  for (const t of S.tx) if (t.src !== 'chase') typed[sig(t)] = (typed[sig(t)] || 0) + 1;
  const fresh = [];
  let skipped = 0;
  for (const t of r.tx) {
    if (have.has(t.id)) { skipped++; continue; }
    if (typed[sig(t)] > 0) { typed[sig(t)]--; skipped++; continue; }
    fresh.push(t);
  }
  const cats = S.plan.cats.map(c => ({ ...c }));
  for (const c of [...(r.cats || []), ...(r.isImport ? [] : r.plan.cats || [])]) {
    const old = cats.find(x => x.id === c.id);
    if (!old) cats.push({ ...c, budget: 0 }); else if (old.archived) delete old.archived;
  }
  const missing = (mine, theirs) => mine.concat(theirs.filter(x => !mine.some(y => y.id === x.id)));
  await backend.replaceAll({ tx: byId(S.tx.concat(fresh)), debts: byId(missing(S.debts, r.debts)), bills: byId(missing(S.bills, r.bills)), plan: { main: { ...S.plan, cats } } });
  UI.restore = null;
  toast(`Added ${fresh.length.toLocaleString()} entries${skipped ? `, skipped ${skipped.toLocaleString()} already here` : ''}.`);
  go('month');
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const a = el.dataset.act;
  if (a === 'backup') saveBackup();
  else if (a === 'restore') $('#restore-file').click();
  else if (a === 'restore-yes') applyRestore(UI.restore);
  else if (a === 'merge-yes') applyMerge(UI.restore);
  else if (a === 'restore-no') { UI.restore = null; renderBanner(); }
  else if (a === 'hide-install') { pref.set(KEY_HIDE_INSTALL, '1'); renderBanner(); }
  else if (a === 'install' && installPrompt) { installPrompt.prompt(); installPrompt.userChoice.finally(() => { installPrompt = null; renderBanner(); }); }
});
document.addEventListener('change', async e => {
  if (e.target.id !== 'restore-file' || !e.target.files[0]) return;
  try { UI.restore = parseBackup(await e.target.files[0].text()); renderBanner(); window.scrollTo(0, 0); }
  catch (err) { toast('That file isn\u2019t a Tallybook file. Choose a backup or import file saved from Tallybook.'); }
});
let lastSeen = today();
document.addEventListener('visibilitychange', () => {
  if (document.hidden || !S.ready || today() === lastSeen) return;
  if (UI.month === lastSeen.slice(0, 7)) UI.month = curMonth();
  lastSeen = today(); render();
});
function boot() {
  const h = location.hash.slice(1);
  if (VIEWS.some(x => x[0] === h)) UI.view = h;
  render();
  backend = localBackend();
  connect();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ('serviceWorker' in navigator) {
    const hadWorker = !!navigator.serviceWorker.controller;
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadWorker && !reloaded && !UI.restore) { reloaded = true; location.reload(); } });
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}
boot();
</script>
